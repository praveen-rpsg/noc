# ATECH NOC Commander - Docker Compose
# Complete deployment with Backend, Frontend, and MongoDB

name: ${COMPOSE_PROJECT_NAME:-ainoc-local}


services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: atech_noc
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "${AINOC_MONGODB_PORT:-27117}:27017"
    networks:
      - atech-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongodb:27017/?authSource=admin
      - DB_NAME=${DB_NAME:-atech_noc}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - HOST=0.0.0.0
      - PORT=8001
      - DEVICE_SECRET_KEY=${DEVICE_SECRET_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY:-}
    ports:
      - "${AINOC_BACKEND_PORT:-8011}:8001"
      - "${AINOC_SNMP_TRAP_PORT:-10162}:1162/udp"
      - "${AINOC_TFTP_PORT:-6900}:69/udp"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - atech-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./tftpboot:/app/tftpboot  

  # Frontend Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8011}
    restart: unless-stopped
    ports:
      - "${AINOC_FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atech-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  atech-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
